name: Build CFMCheat IPA

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'build_output.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Clone libkfd
        run: |
          git clone --depth 1 https://github.com/felix-pb/kfd.git libkfd_repo
          find libkfd_repo -type d | head -30

      - name: Vendor libkfd headers into project
        run: |
          set -e
          # libkfd 是 header-only 实现（kopen/kread/kwrite/kclose 定义在 libkfd.h）
          # 仓库结构: kfd/libkfd.h + kfd/libkfd/*.h
          cp -R libkfd_repo/kfd CFMCheat/libkfd
          echo "=== vendored headers ==="
          find CFMCheat/libkfd -name "*.h" | head -10
          echo "=== shim ==="
          cat CFMCheat/kfd_shim.c

      - name: Build app (arm64, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CFMCheat.xcodeproj \
            -target CFMCheat \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$(pwd)/CFMCheat/libkfd" \
            SYMROOT="$(pwd)/build/SYMROOT" \
            OBJROOT="$(pwd)/build/OBJROOT" \
            build 2>&1 | tee build_output.log | tail -60

      - name: Publish build log to repo (on failure)
        if: failure()
        run: |
          tail -2000 build_output.log > /tmp/tail.log && mv /tmp/tail.log build_output.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build_output.log
          git commit -m "ci build log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "WARN: push log failed"

      - name: Package IPA
        if: success()
        run: |
          APP_PATH=$(find build -name "CFMCheat.app" -path "*Release-iphoneos*" | head -1)
          echo "APP: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          brew install ldid 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then
            ldid "-S$(pwd)/CFMCheat/CFMCheat.entitlements" build/Payload/CFMCheat.app/CFMCheat
            echo "ldid 伪签名完成"
          else
            echo "ldid 不可用，跳过伪签名（TrollStore/SideStore 安装时会重签）"
          fi
          cd build
          zip -qry CFMCheat.ipa Payload
          ls -la CFMCheat.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CFMCheat-ipa
          path: build/CFMCheat.ipa
          retention-days: 30

      - name: Create Release with IPA
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CFMCheat IPA build ${{ github.run_number }}
          files: build/CFMCheat.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
